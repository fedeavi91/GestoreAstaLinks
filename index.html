<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GestoreAsta</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d0f14;
    color: #f2f3f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .card { max-width: 360px; }
  h1 { font-size: 1.3em; margin-bottom: 8px; }
  p { color: #9aa1ac; line-height: 1.5; }
  a.button {
    display: inline-block;
    margin-top: 16px;
    padding: 12px 24px;
    background: linear-gradient(135deg, #5b8cff, #a855f7);
    color: white;
    text-decoration: none;
    border-radius: 999px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>GestoreAsta</h1>
    <p id="message">Ti sto portando all'asta...</p>
    <div id="fallback" style="display:none">
      <p>Se non vieni reindirizzato automaticamente:</p>
      <a class="button" id="manual-link" href="#">Apri l'asta</a>
    </div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var token = params.get("t");
      var messageEl = document.getElementById("message");
      var fallbackEl = document.getElementById("fallback");
      var linkEl = document.getElementById("manual-link");

      if (!token) {
        messageEl.textContent = "Link non valido: manca il parametro di destinazione.";
        return;
      }

      var destination;
      try {
        // Il token è "ip:porta" in base64: nessun dato sensibile, serve solo
        // a evitare che l'IP appaia come cifre in chiaro nel link condiviso
        // (WhatsApp lo scambierebbe per un numero di telefono, non per URL).
        var decoded = atob(token.replace(/-/g, "+").replace(/_/g, "/"));
        destination = "http://" + decoded + "/join";
      } catch (e) {
        messageEl.textContent = "Link non valido: impossibile leggere la destinazione.";
        return;
      }

      linkEl.href = destination;
      fallbackEl.style.display = "block";
      window.location.replace(destination);
    })();
  </script>
</body>
</html>
